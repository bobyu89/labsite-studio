name: Deploy LabSite Cloud to Cloudflare

# Every push to main tests, migrates D1 and deploys both Workers, so nobody
# needs Node or wrangler on their own computer. Needs the repository secret
# CLOUDFLARE_API_TOKEN (permissions: Workers Scripts: Edit, D1: Edit) and,
# if the token can see more than one account, CLOUDFLARE_ACCOUNT_ID.
# Without the token the job only prints how to set it up and still passes.
# Worker secrets (GOOGLE_CLIENT_SECRET, ANTHROPIC_API_KEY, …) live in the
# Cloudflare dashboard; a deploy does not touch them.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy (see cloud/README.md)."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm ci --prefix cloud
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm test
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm --prefix cloud run migrate:remote
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm --prefix cloud run deploy
